<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Bipasha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: rgba(255, 255, 255, 0.75);
      --ink: #2b2230;
      --muted: #75687a;
      --accent: #b4687f;
      --accent-soft: #f3d9e0;
      --lilac: #e8def5;
      --gold: #c9a66b;
      --line: rgba(70, 45, 70, 0.1);
      --shadow: 0 20px 50px -20px rgba(70, 40, 70, 0.25);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", "Segoe UI", system-ui, sans-serif;
      --radius: 28px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% -5%, var(--accent-soft), transparent 60%),
        radial-gradient(800px 500px at 100% 20%, var(--lilac), transparent 60%),
        radial-gradient(700px 500px at 0% 70%, #fbeadb, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    h1 { font-family: var(--serif); font-size: 2.6rem; font-weight: 500; margin: 0 0 0.3rem; color: var(--ink); }
    h1 em { color: var(--accent); font-style: italic; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.5rem; }
    .portrait {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: 200px 200px 24px 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 6px solid rgba(255,255,255,.85);
      background: linear-gradient(135deg, var(--accent-soft), var(--lilac));
      margin-bottom: 1.5rem;
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 1rem;
    }
    .pill {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
      box-shadow: 0 8px 20px -10px rgba(70,40,70,.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .pill:hover { transform: translateY(-2px); background: var(--accent-soft); }
    .file-input-wrap {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }
    .file-input-wrap input {
      display: block;
      margin: 0.4rem auto 0;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>For <em>Bipasha</em></h1>
    <p>Happy 17th Birthday ♡</p>
    
    <div class="portrait">
      <img id="photoPreview" src="assets/photos/photo1.jpg" alt="Bipasha" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%23f3d9e0\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23b4687f\' font-family=\'serif\' font-size=\'16\'>Photo</text></svg>'" />
    </div>

    <div class="controls">
      <button class="pill" id="musicBtn" type="button">♫ Play Music</button>
      <button class="pill" id="muteBtn" type="button">🔊 Mute</button>
    </div>

    <div class="file-input-wrap">
      <label>Quick preview from device:
        <input type="file" id="mediaInput" multiple accept="image/*,audio/*" />
      </label>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto" src="assets/music/birthday-song.mp3"></audio>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const muteBtn = document.getElementById('muteBtn');
    const photoPreview = document.getElementById('photoPreview');
    const mediaInput = document.getElementById('mediaInput');

    bgMusic.volume = 0.5;

    musicBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.textContent = '♫ Pause Music';
        }).catch(() => {
          alert("Could not play automatically. Please select an audio file using the chooser below.");
        });
      } else {
        bgMusic.pause();
        musicBtn.textContent = '♫ Play Music';
      }
    });

    muteBtn.addEventListener('click', () => {
      bgMusic.muted = !bgMusic.muted;
      muteBtn.textContent = bgMusic.muted ? '🔇 Unmute' : '🔊 Mute';
    });

    mediaInput.addEventListener('change', (e) => {
      const files = e.target.files;
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          photoPreview.src = URL.createObjectURL(file);
        } else if (file.type.startsWith('audio/')) {
          bgMusic.src = URL.createObjectURL(file);
          bgMusic.play().then(() => {
            musicBtn.textContent = '♫ Pause Music';
          });
        }
      }
    });
  </script>
</body>
</html>
