<!DOCTYPE html>
<!--
  HOW TO EDIT THIS WEBSITE
  1. Photos  -> assets/photos/   named photo1.jpg, photo2.jpg ... (jpg, jpeg, png, webp all work)
  2. Videos  -> assets/videos/   named video1.mp4, video2.mp4 (mp4, mov, webm work)
  3. Music   -> assets/music/    named birthday-song.mp3 (mp3, m4a, wav, ogg work)
  4. Change text in the SETTINGS section at the top of the <script>
  5. Save, push to GitHub, GitHub Pages updates the site

  TESTING YOUR FILES: open the page with  ?setup  at the end (index.html?setup)
  to see which files were found, or pick files from your device to preview them.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Bipasha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbf7f2;
      --bg-2: #f6eef0;
      --surface: rgba(255, 255, 255, 0.7);
      --ink: #2b2230;
      --muted: #75687a;
      --accent: #b4687f;
      --accent-soft: #f3d9e0;
      --lilac: #e8def5;
      --gold: #c9a66b;
      --line: rgba(70, 45, 70, 0.1);
      --shadow: 0 20px 50px -20px rgba(70, 40, 70, 0.25);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", "Segoe UI", system-ui, sans-serif;
      --hand: "Caveat", "Segoe Print", cursive;
      --radius: 28px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% -5%, var(--accent-soft), transparent 60%),
        radial-gradient(800px 500px at 100% 20%, var(--lilac), transparent 60%),
        radial-gradient(700px 500px at 0% 70%, #fbeadb, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; margin: 0; }
    img, video { max-width: 100%; }
    button { font-family: inherit; }

    /* ---------- Intro ---------- */
    .intro {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center; padding: 1.5rem;
      background:
        radial-gradient(600px 400px at 20% 20%, var(--accent-soft), transparent 70%),
        radial-gradient(600px 400px at 80% 80%, var(--lilac), transparent 70%),
        var(--bg);
      transition: opacity .9s ease, visibility .9s ease, transform .9s ease;
    }
    .intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.03); }
    .intro-card { text-align: center; max-width: 520px; }
    .intro-heart {
      width: 74px; height: 74px; margin: 0 auto 1.6rem; border-radius: 50%;
      display: grid; place-items: center; font-size: 1.9rem; color: var(--accent);
      background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
      animation: beat 2.6s ease-in-out infinite;
    }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .intro h1 { font-size: clamp(3rem, 11vw, 5.5rem); line-height: 1; color: var(--ink); }
    .intro p { margin: 1rem 0 2rem; color: var(--muted); font-size: 1.1rem; line-height: 1.7; }

    .btn {
      appearance: none; border: 0; cursor: pointer; border-radius: 999px;
      padding: .95rem 1.8rem; font-weight: 600; font-size: .95rem; letter-spacing: .03em;
      color: #fff; background: linear-gradient(135deg, var(--accent), #c98a9d);
      box-shadow: 0 14px 30px -10px rgba(180, 104, 127, .6);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -10px rgba(180, 104, 127, .7); }
    .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }

    /* ---------- Layout ---------- */
    .main { opacity: 0; visibility: hidden; transition: opacity 1s ease; }
    .main.visible { opacity: 1; visibility: visible; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }
    section { padding: clamp(3.5rem, 9vw, 7rem) 0; scroll-margin-top: 20px; }
    .kicker {
      display: inline-block; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin-bottom: .9rem;
    }
    .section-title { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.08; }
    .section-head { text-align: center; margin-bottom: clamp(2rem, 5vw, 3.5rem); }
    .section-head p { color: var(--muted); margin: .8rem auto 0; max-width: 520px; line-height: 1.7; }

    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s ease, transform .9s ease; }
    .reveal.in { opacity: 1; transform: none; }

    /* progress + nav */
    .progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; }
    .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent), #a58bd0); }
    .dots {
      position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 40;
      display: flex; flex-direction: column; gap: 12px;
    }
    .dots button {
      width: 10px; height: 10px; border-radius: 50%; padding: 0; cursor: pointer;
      border: 1px solid rgba(70,45,70,.25); background: transparent; transition: all .3s ease;
    }
    .dots button.active { background: var(--accent); border-color: var(--accent); transform: scale(1.35); }

    .controls { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; gap: 8px; }
    .pill {
      border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(12px);
      color: var(--ink); border-radius: 999px; padding: .6rem 1rem; font-size: .8rem; cursor: pointer;
      font-weight: 500; box-shadow: 0 8px 20px -10px rgba(70,40,70,.3); transition: transform .2s ease;
    }
    .pill:hover { transform: translateY(-2px); }

    /* ---------- Hero ---------- */
    .hero { padding-top: clamp(3rem, 8vw, 6rem); }
    .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(2rem, 6vw, 5rem); align-items: center; }
    .hero h1 { font-size: clamp(3rem, 8vw, 6rem); line-height: 1; margin: .4rem 0 1.2rem; }
    .hero h1 em { color: var(--accent); font-style: italic; }
    .hero h1 .hh { color: var(--accent); font-size: .6em; vertical-align: .18em; margin-left: .1em; }
    .hero .sub { font-size: 1.25rem; color: var(--muted); line-height: 1.7; margin-bottom: 2rem; max-width: 460px; }
    .stats { display: flex; gap: 2rem; flex-wrap: wrap; padding-top: 1.6rem; border-top: 1px solid var(--line); }
    .stat strong { display: block; font-family: var(--serif); font-size: 2.2rem; color: var(--accent); line-height: 1; }
    .stat span { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .portrait {
      position: relative; aspect-ratio: 4 / 5; border-radius: 220px 220px 28px 28px; overflow: hidden;
      box-shadow: var(--shadow); border: 8px solid rgba(255,255,255,.85);
      background: linear-gradient(135deg, var(--accent-soft), var(--lilac));
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .portrait .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); font-family: var(--serif); font-size: 1.4rem; font-style: italic; }
    .portrait-wrap { position: relative; }
    .portrait-wrap::before {
      content: ""; position: absolute; inset: -18px -18px auto auto; width: 70%; height: 70%;
      border: 1px solid var(--gold); border-radius: 200px 200px 20px 20px; opacity: .6; z-index: -1;
    }
    .tag {
      position: absolute; left: -12px; bottom: 32px; background: #fff; padding: .7rem 1.1rem; border-radius: 999px;
      font-family: var(--hand); font-size: 1.35rem; color: var(--accent); box-shadow: var(--shadow); transform: rotate(-4deg);
    }

    /* ---------- Message cards ---------- */
    .letter {
      max-width: 720px; margin: 0 auto; padding: clamp(1.8rem, 5vw, 3.4rem); border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(10px);
      text-align: center;
    }
    .letter h2 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1.4rem; }
    .letter p { font-size: 1.12rem; line-height: 1.9; color: #4a3f4f; margin: 0 0 1.1rem; }
    .letter p:last-child { margin: 0; }
    .ornament { color: var(--gold); letter-spacing: .5em; margin-bottom: 1rem; font-size: .9rem; }

    /* ---------- Gallery ---------- */
    .gallery { columns: 3; column-gap: 1.1rem; }
    .gallery figure { margin: 0 0 1.1rem; break-inside: avoid; }
    .photo {
      display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; background: #fff;
      border-radius: 18px; overflow: hidden; box-shadow: 0 14px 34px -18px rgba(70,40,70,.4);
      transition: transform .4s ease, box-shadow .4s ease;
    }
    .photo:hover { transform: translateY(-5px); box-shadow: 0 24px 44px -18px rgba(70,40,70,.45); }
    .photo img { display: block; width: 100%; height: auto; transition: transform .6s ease; }
    .photo:hover img { transform: scale(1.04); }
    .gallery figcaption { font-family: var(--hand); font-size: 1.3rem; color: var(--muted); padding: .5rem .3rem 0; text-align: center; }
    .empty-note {
      text-align: center; padding: 3rem 1rem; color: var(--muted); border: 1px dashed var(--line);
      border-radius: var(--radius); background: var(--surface);
    }

    /* ---------- Videos ---------- */
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.4rem; }
    .vcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .vcard video { width: 100%; display: block; background: #1d1521; aspect-ratio: 16 / 10; object-fit: contain; }
    .vcard h3 { padding: 1.1rem 1.4rem 1.3rem; font-size: 1.5rem; }

    /* ---------- Wishes ---------- */
    .wishes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .wish {
      padding: 1.8rem 1.2rem; text-align: center; border-radius: 22px; background: var(--surface);
      border: 1px solid var(--line); font-family: var(--serif); font-size: 1.55rem; font-style: italic; color: var(--accent);
      transition: transform .35s ease, box-shadow .35s ease;
    }
    .wish:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .wish small { display: block; font-family: var(--sans); font-style: normal; font-size: .7rem; letter-spacing: .2em; color: var(--gold); margin-bottom: .5rem; }

    /* ---------- Reveal ---------- */
    .reveal-card {
      position: relative; border-radius: 36px; overflow: hidden; min-height: 460px; display: grid; place-items: center;
      text-align: center; padding: 3rem 1.5rem; color: #fff;
      background: linear-gradient(135deg, #5b3a63, #2e2034);
      box-shadow: var(--shadow);
    }
    .reveal-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
    .reveal-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,25,45,.2), rgba(40,25,45,.6)); }
    .reveal-card .inner { position: relative; z-index: 1; max-width: 640px; }
    .reveal-card p { margin: 0 0 .7rem; font-family: var(--serif); font-size: clamp(1.5rem, 3.6vw, 2.5rem); line-height: 1.35; }
    .reveal-card p.small { font-family: var(--sans); font-size: .75rem; letter-spacing: .24em; text-transform: uppercase; opacity: .8; }

    .secret { text-align: center; padding-top: 0; }
    .envelope {
      width: 230px; height: 150px; margin: 1.5rem auto; position: relative; cursor: pointer; border: 0; padding: 0;
      background: linear-gradient(135deg, #fff, var(--accent-soft)); border-radius: 12px; box-shadow: var(--shadow);
      transition: transform .3s ease;
    }
    .envelope:hover { transform: translateY(-4px) rotate(-1deg); }
    .envelope::before {
      content: ""; position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(to bottom right, transparent 49.5%, rgba(180,104,127,.25) 50%) top left / 50% 100% no-repeat,
                  linear-gradient(to bottom left, transparent 49.5%, rgba(180,104,127,.25) 50%) top right / 50% 100% no-repeat;
    }
    .envelope span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.8rem; color: var(--accent); z-index: 1; }
    .secret-msg {
      max-width: 520px; margin: 0 auto; font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.5;
      color: var(--accent); max-height: 0; opacity: 0; overflow: hidden; transition: all .6s ease;
    }
    .secret-msg.open { max-height: 260px; opacity: 1; margin-top: 1rem; }

    /* ---------- Final ---------- */
    .final-card {
      position: relative; border-radius: 36px; overflow: hidden; min-height: 520px; display: grid; place-items: center;
      text-align: center; padding: 3rem 1.5rem; cursor: pointer; color: #fff; box-shadow: var(--shadow);
      background: linear-gradient(135deg, var(--accent), #7f5aa6);
    }
    .final-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .final-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,25,45,.25), rgba(40,25,45,.65)); }
    .final-card .inner { position: relative; z-index: 1; max-width: 680px; }
    .final-card h2 { font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1.05; margin: .6rem 0; }
    .final-card p { font-size: 1.2rem; line-height: 1.7; margin: .4rem 0; }
    .final-card .hint { margin-top: 1.6rem; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; opacity: .85; }
    footer { text-align: center; padding: 2rem 1rem 5rem; color: var(--muted); font-size: .85rem; }

    /* ---------- Overlay / lightbox ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 1rem;
      background: rgba(30, 20, 36, .85); backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility .5s ease;
    }
    .overlay.visible { opacity: 1; visibility: visible; }
    .scene { position: relative; text-align: center; color: #fff; max-width: 720px; width: 100%; padding: 2rem 1rem; }
    .scene .tiny { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; opacity: .7; }
    .scene h3 { font-size: clamp(2rem, 6vw, 3.4rem); margin: 1rem 0; }
    .scene h2 { font-size: clamp(2.6rem, 8vw, 5rem); color: #f3d9e0; }
    .scene p { font-size: 1.25rem; opacity: .9; }
    .scene .line { opacity: 0; transform: translateY(16px); transition: all .7s ease; }
    .scene .line.visible { opacity: 1; transform: none; }
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti i {
      position: absolute; top: -20px; width: 9px; height: 16px; border-radius: 4px; opacity: 0;
      animation: fall linear forwards;
    }
    @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(110vh) rotate(600deg); opacity: 0; } }

    .lightbox { background: rgba(20, 14, 24, .92); z-index: 95; }
    .lightbox img { max-width: min(92vw, 1100px); max-height: 86vh; border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .lb-btn {
      position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2);
      width: 48px; height: 48px; border-radius: 50%; font-size: 1.3rem; cursor: pointer;
    }
    .lb-btn:hover { background: rgba(255,255,255,.22); }
    .lb-close { top: 18px; right: 18px; }
    .lb-prev { left: 18px; top: 50%; }
    .lb-next { right: 18px; top: 50%; }
    .lb-count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: .85rem; }

    /* ---------- Setup panel ---------- */
    .setup {
      position: fixed; left: 16px; bottom: 16px; z-index: 70; width: min(340px, calc(100vw - 32px));
      background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 1.1rem; box-shadow: var(--shadow);
      font-size: .85rem; line-height: 1.6;
    }
    .setup h4 { margin: 0 0 .4rem; font-size: 1rem; }
    .setup ul { margin: .4rem 0 .8rem; padding-left: 1.1rem; color: var(--muted); }
    .setup input { width: 100%; font-size: .8rem; }

    /* ---------- Ambient FX ---------- */
    #bgFx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .main { position: relative; z-index: 1; }
    body::before {
      content: ""; position: fixed; inset: -15%; z-index: -1; pointer-events: none;
      background:
        radial-gradient(40% 35% at 20% 25%, rgba(243, 217, 224, .7), transparent 70%),
        radial-gradient(35% 35% at 80% 30%, rgba(232, 222, 245, .7), transparent 70%),
        radial-gradient(40% 40% at 60% 85%, rgba(251, 234, 219, .8), transparent 70%);
      animation: drift 26s ease-in-out infinite alternate;
    }
    @keyframes drift { to { transform: translate3d(-3%, 4%, 0) scale(1.08); } }
    .spark { position: fixed; z-index: 120; pointer-events: none; animation: sparkle .9s ease-out forwards; }
    @keyframes sparkle {
      0% { transform: translate(-50%, -50%) scale(.4) rotate(0); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% + 26px)) scale(1.1) rotate(120deg); opacity: 0; }
    }
    #burstLayer { z-index: 85; }

    .intro-card { position: relative; z-index: 1; }
    .balloons { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .balloon {
      position: absolute; bottom: -160px; left: var(--x); width: var(--sz, 54px); height: calc(var(--sz, 54px) * 1.25);
      border-radius: 50% 50% 48% 48%; opacity: .92;
      background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.8) 0 7%, transparent 8%), var(--c);
      box-shadow: inset -7px -9px 16px rgba(0,0,0,.09);
      animation: rise var(--d) linear infinite; animation-delay: var(--dl);
    }
    .balloon::before { content: ""; position: absolute; left: 50%; top: 96%; width: 10px; height: 8px; margin-left: -5px; background: var(--c); clip-path: polygon(50% 0, 0 100%, 100% 100%); }
    .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 60px; background: rgba(70, 45, 70, .25); }
    @keyframes rise {
      0% { transform: translate(0, 0) rotate(-4deg); }
      50% { transform: translate(18px, -65vh) rotate(4deg); }
      100% { transform: translate(-10px, -125vh) rotate(-3deg); }
    }
    .deco { position: absolute; color: var(--gold); font-size: 2rem; pointer-events: none; animation: bob 4s ease-in-out infinite alternate; }
    .deco.d1 { top: -14px; left: -12px; }
    .deco.d2 { top: 32%; right: -26px; font-size: 1.4rem; color: var(--accent); animation-delay: -1.5s; }
    .deco.d3 { bottom: 16%; right: -10px; font-size: 1.1rem; color: #a58bd0; animation-delay: -2.5s; }
    @keyframes bob { to { transform: translateY(-12px) rotate(15deg); } }

    /* ---------- Play zone ---------- */
    .play-stage { max-width: 860px; margin: 0 auto; }
    .badges { display: flex; justify-content: center; gap: .7rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
    .badge {
      display: flex; align-items: center; gap: .5rem; padding: .4rem .95rem .4rem .4rem; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line); font-size: .78rem; font-weight: 600; color: var(--muted);
      filter: grayscale(1); opacity: .65; transition: all .5s ease;
    }
    .badge i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-style: normal; font-size: 1rem; }
    .badge.got { filter: none; opacity: 1; color: var(--accent); border-color: var(--accent); box-shadow: 0 10px 22px -10px rgba(180,104,127,.6); transform: translateY(-2px); }
    .tabs {
      display: flex; gap: .3rem; padding: .35rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      width: max-content; max-width: 100%; margin: 0 auto 1.2rem; overflow-x: auto;
    }
    .tabs button { border: 0; background: transparent; padding: .65rem 1.1rem; border-radius: 999px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); white-space: nowrap; transition: all .3s ease; }
    .tabs button.active { background: linear-gradient(135deg, var(--accent), #c98a9d); color: #fff; box-shadow: 0 10px 20px -10px rgba(180,104,127,.7); }
    .game { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(.9rem, 3vw, 1.6rem); backdrop-filter: blur(10px); }
    .game[hidden] { display: none; }
    .game-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
    .game-head h3 { font-size: 1.8rem; }
    .game-head p { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; max-width: 440px; line-height: 1.5; }
    .hud { display: flex; gap: .5rem; align-items: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
    .hud span { padding: .4rem .8rem; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
    .hud #catchLives { color: var(--accent); letter-spacing: .1em; }
    .canvas-wrap { position: relative; border-radius: 20px; overflow: hidden; background: #fbeef2; box-shadow: inset 0 0 0 1px var(--line); }
    .canvas-wrap canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; touch-action: none; }
    .game-over {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1rem;
      background: rgba(251, 247, 242, .72); backdrop-filter: blur(5px); transition: opacity .4s ease, visibility .4s ease;
    }
    .game-over.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .game-over h4 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 .4rem; color: var(--accent); }
    .game-over p { margin: 0 auto 1.2rem; color: var(--muted); max-width: 360px; line-height: 1.6; }
    .game-note { text-align: center; font-family: var(--serif); font-size: 1.5rem; color: var(--accent); min-height: 2rem; margin: .9rem 0 0; }

    .memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; max-width: 560px; margin: 0 auto; }
    .mcard { aspect-ratio: 3 / 4; perspective: 800px; border: 0; background: none; padding: 0; cursor: pointer; }
    .mcard .in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
    .mcard.flip .in { transform: rotateY(180deg); }
    .mcard .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; display: grid; place-items: center; }
    .mcard .front {
      color: rgba(255,255,255,.85); font-size: 1.5rem;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.28) 0 5px, transparent 6px) 0 0 / 22px 22px,
        linear-gradient(135deg, var(--accent), #a58bd0);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); transition: transform .3s ease;
    }
    .mcard:hover .front { transform: scale(1.03); }
    .mcard .back { transform: rotateY(180deg); background: #fff; font-size: 2.3rem; border: 1px solid var(--line); }
    .mcard .back img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mcard.matched .back { box-shadow: 0 0 0 3px var(--gold), 0 10px 24px -8px rgba(201,166,107,.7); }

    .cake-night {
      border-radius: 20px; padding: .6rem .6rem .2rem; overflow: hidden;
      background: radial-gradient(70% 60% at 50% 55%, #4b3257, transparent 75%), linear-gradient(180deg, #241a2c, #3a2745);
    }
    .cake-night svg { width: 100%; height: auto; max-width: 600px; display: block; margin: 0 auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .candle { cursor: pointer; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .9s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1) rotate(-3deg); } 100% { transform: scale(.88, 1.14) rotate(3deg); } }
    .candle .flame, .candle .glow { transition: opacity .25s ease; }
    .candle.out .flame, .candle.out .glow { opacity: 0; }
    .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .candle.out .smoke { animation: smoke 1.5s ease-out forwards; }
    @keyframes smoke { 0% { opacity: .7; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-36px) scale(1.7); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .cake-actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

    .scratch { position: relative; max-width: 520px; aspect-ratio: 16 / 9; margin: 0 auto; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; }
    .scratch .prize {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1rem;
      background: radial-gradient(circle at 20% 20%, #fff, #fbeef2 60%, #efe6fa); border: 2px dashed var(--gold); border-radius: 20px;
    }
    .scratch .prize small { letter-spacing: .24em; text-transform: uppercase; font-size: .68rem; color: var(--gold); font-weight: 600; }
    .scratch .prize h4 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.5rem, 5vw, 2.2rem); color: var(--accent); margin: .3rem 0; line-height: 1.15; }
    .scratch .prize p { margin: 0; color: var(--muted); font-size: .85rem; }
    .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity .9s ease; }
    .scratch canvas.done { opacity: 0; pointer-events: none; }

    .unlock { max-width: 620px; margin: 1.4rem auto 0; padding: 1.3rem 1.6rem; text-align: center; border-radius: 22px; border: 1px dashed rgba(70,45,70,.2); color: var(--muted); background: rgba(255,255,255,.4); transition: all .6s ease; }
    .unlock.open { border: 1px solid var(--gold); background: linear-gradient(135deg, #fff, #fbeef2); color: var(--ink); box-shadow: var(--shadow); }
    .unlock strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.8rem; color: var(--accent); margin-bottom: .3rem; }
    @media (max-width: 520px) { .memory { gap: .5rem; } .game-head h3 { font-size: 1.5rem; } .deco.d2, .deco.d3 { right: 4px; } }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; text-align: center; }
      .hero .sub { margin-left: auto; margin-right: auto; }
      .stats { justify-content: center; }
      .portrait-wrap { max-width: 420px; margin: 0 auto; order: -1; }
      .gallery { columns: 2; }
      .wishes { grid-template-columns: repeat(2, 1fr); }
      .dots { display: none; }
    }
    @media (max-width: 520px) {
      .gallery { columns: 1; }
      .wishes { grid-template-columns: 1fr; }
      .tag { left: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto"></audio>

  <script>
    // ============================================================
    //  ✏️ SETTINGS — EDIT TEXT HERE
    // ============================================================
    const personName = 'Bipasha';
    const birthdayAge = 17;
    const siteContent = {
      intro: { title: `For ${personName}…`, subtitle: `I made something for your ${birthdayAge}th.`, button: 'Open it ♡' },
      hero: {
        badge: 'A little something',
        title: `Happy ${birthdayAge}th Birthday, ${personName} ♡`,
        subtitle: `${birthdayAge} looks good on you.`,
        message: `It’s kind of crazy that we’ve only known each other for a few months.

Somehow, between ordinary college days, random conversations, and laughing over little things, you turned into one of the best parts of my days.

So today, I hope ${birthdayAge} brings you more reasons to smile, more memories worth keeping, and all the beautiful little things you deserve.`
      },
      friendship: {
        title: 'It hasn’t been that long…',
        message: `It hasn’t actually been that long, but somehow you already feel like someone who’s always been around.

Sometimes it’s the small moments that make a friendship feel real: the random conversations, the easy laughter, and the memories that appear before you even realize you’re making them.`
      },
      photos: { title: 'Just… her.', subtitle: 'A few little pieces of the person we’re celebrating today.' },
      videos: { title: 'A little more of you.', titles: ['A little piece of you.', 'Because one photo wasn’t enough.'] },
      wishes: {
        title: `What I hope ${birthdayAge} brings you`,
        items: ['more laughter', 'more confidence', 'more unexpected happiness', 'more reasons to smile', 'more adventures', 'more beautiful days']
      },
      special: { teaser: 'One thing I haven’t said yet…', reveal: 'I’m really glad I met you.', secondLine: 'Even if it hasn’t been that long.', realization: 'Some people feel like old friends almost right away.', realizationEnd: 'You’re one of them.', overlay: 'Thank you for being you.' },
      final: { title: `Happy ${birthdayAge}th, ${personName} ♡`, message: `Here’s to ${birthdayAge}.`, subtitle: 'Keep being you.' },
      play: {
        title: 'Little games, just for you',
        subtitle: 'Four tiny games to play. Finish them all to unlock a secret.',
        locked: 'Finish all four games to unlock a secret…',
        unlockTitle: 'Secret unlocked ✨',
        unlockText: `Four out of four. Officially the champion of your own birthday page, ${personName}.`,
        catch: { title: 'Catch the hearts', hint: 'Steer the basket with your mouse, finger or arrow keys. Dodge the storm clouds!', goal: 15 },
        memory: { title: 'Memory match', hint: 'Flip the cards and find every pair.' },
        cake: { title: 'Make a wish', hint: 'Tap (or drag across) the candles to blow them out.', done: 'Wish made. Now go make it come true ✨' },
        scratch: { title: 'Scratch card', hint: 'Scratch off the gold to reveal a surprise.', eyebrow: 'birthday coupon', prize: 'One free slice of cake', fine: 'Redeemable any time. Terms: you have to smile.' }
      }
    };

    // Captions match photo order (photo1, photo2, ...). Leave '' for no caption.
    const photoCaptions = ['this smile.', '17 suits you.', 'main character energy.'];

    // ============================================================
    //  📸 MEDIA — files are auto-detected, any extension below works
    // ============================================================
    const media = {
      photoFolder: 'assets/photos/',
      photoName: 'photo',          // photo1, photo2, photo3 ...
      photoExts: ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG', 'WEBP'],
      maxPhotos: 40,               // looks for photo1 … photo40
      videoFolder: 'assets/videos/',
      videoNames: ['video1', 'video2'],
      videoExts: ['mp4', 'MP4', 'mov', 'MOV', 'webm', 'm4v'],
      musicFolder: 'assets/music/',
      musicName: 'birthday-song',
      musicExts: ['mp3', 'MP3', 'm4a', 'wav', 'ogg']
    };

    // ============================================================
    //  ENGINE — no need to edit below
    // ============================================================
    const $ = (id) => document.getElementById(id);
    const state = { photos: [], videos: [], music: null, report: {} };

    const paragraphs = (t) => t.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

    // --- Static text ---
    $('introTitle').textContent = siteContent.intro.title;
    $('introSubtitle').textContent = siteContent.intro.subtitle;
    $('openBtn').textContent = siteContent.intro.button;
    $('heroBadge').textContent = siteContent.hero.badge;
    $('heroTitle').innerHTML = siteContent.hero.title.replace(personName, `<em>${personName}</em>`).replace('♡', '<span class="hh">♡</span>');
    $('heroSubtitle').textContent = siteContent.hero.subtitle;
    $('birthdayTitle').textContent = `${birthdayAge} looks good on you`;
    $('birthdayText').innerHTML = paragraphs(siteContent.hero.message);
    $('photosTitle').textContent = siteContent.photos.title;
    $('photosSubtitle').textContent = siteContent.photos.subtitle;
    $('friendshipTitle').textContent = siteContent.friendship.title;
    $('friendshipText').innerHTML = paragraphs(siteContent.friendship.message);
    $('videosTitle').textContent = siteContent.videos.title;
    $('wishesTitle').textContent = siteContent.wishes.title;
    $('specialTeaser').textContent = siteContent.special.teaser;
    $('secretMsg').innerHTML = `${siteContent.special.reveal}<br>${siteContent.special.secondLine}`;
    $('rv1').textContent = 'You know what I realized?';
    $('rv2').textContent = siteContent.special.realization;
    $('rv3').textContent = siteContent.special.realizationEnd;
    $('finalName').textContent = 'for ' + personName;
    $('finalTitle').textContent = siteContent.final.title;
    $('finalSubtitle').textContent = `${siteContent.final.message} ${siteContent.final.subtitle}`;
    $('ovTag').textContent = 'One last thing…';
    $('ovMsg').textContent = siteContent.special.overlay;
    $('ovTitle').textContent = siteContent.final.title;
    $('ovSub').textContent = siteContent.final.message;

    siteContent.wishes.items.forEach((w, i) => {
      const d = document.createElement('div');
      d.className = 'wish reveal';
      d.style.transitionDelay = (i % 3) * 0.12 + 's';
      d.innerHTML = `<small>0${i + 1}</small>${w}`;
      $('wishGrid').appendChild(d);
    });

    // --- Smart file detection (fixes wrong extension / missing file problems) ---
    function probeImage(url) {
      return new Promise(res => {
        const img = new Image();
        img.onload = () => res(url);
        img.onerror = () => res(null);
        img.src = url;
      });
    }
    function probeMedia(tag, url) {
      return new Promise(res => {
        const el = document.createElement(tag);
        el.preload = 'metadata';
        const done = (v) => { el.removeAttribute('src'); res(v); };
        el.onloadedmetadata = () => done(url);
        el.onerror = () => done(null);
        setTimeout(() => done(null), 15000);
        el.src = url;
      });
    }
    async function firstThatLoads(urls, prober) {
      for (const u of urls) {
        const ok = await prober(u);
        if (ok) return ok;
      }
      return null;
    }
    async function detectPhotos() {
      const jobs = [];
      for (let n = 1; n <= media.maxPhotos; n++) {
        const urls = media.photoExts.map(e => `${media.photoFolder}${media.photoName}${n}.${e}`);
        jobs.push(firstThatLoads(urls, probeImage));
      }
      return (await Promise.all(jobs)).filter(Boolean);
    }
    async function detectVideos() {
      const out = await Promise.all(media.videoNames.map(name =>
        firstThatLoads(media.videoExts.map(e => `${media.videoFolder}${name}.${e}`), (u) => probeMedia('video', u))));
      return out.filter(Boolean);
    }
    async function detectMusic() {
      return firstThatLoads(media.musicExts.map(e => `${media.musicFolder}${media.musicName}.${e}`), (u) => probeMedia('audio', u));
    }

    // --- Rendering media ---
    function renderPhotos() {
      const g = $('gallery');
      g.innerHTML = '';
      const photos = state.photos;
      $('statPhotos').textContent = photos.length;
      if (!photos.length) {
        g.style.columns = '1';
        g.innerHTML = `<div class="empty-note">Add photos to <b>${media.photoFolder}</b> named <b>${media.photoName}1.jpg</b>, <b>${media.photoName}2.jpg</b> …</div>`;
      } else {
        g.style.columns = '';
        photos.forEach((src, i) => {
          const f = document.createElement('figure');
          f.className = 'reveal';
          f.innerHTML = `<button class="photo" type="button" aria-label="Open photo ${i + 1}"><img src="${src}" alt="${personName} photo ${i + 1}" loading="lazy" /></button>` +
            (photoCaptions[i] ? `<figcaption>${photoCaptions[i]}</figcaption>` : '');
          f.querySelector('button').addEventListener('click', () => openLightbox(i));
          g.appendChild(f);
          observer.observe(f);
        });
      }

      const portrait = $('portrait');
      portrait.innerHTML = photos[0] ? `<img src="${photos[0]}" alt="${personName}" />` : '<div class="empty">Bipasha</div>';

      const r = $('revealImg');
      const rsrc = photos[1] || photos[0];
      if (rsrc) { r.src = rsrc; r.hidden = false; } else r.hidden = true;

      const f = $('finalImg');
      const fsrc = photos[2] || photos[photos.length - 1];
      if (fsrc) { f.src = fsrc; f.hidden = false; } else f.hidden = true;
    }

    function renderVideos() {
      const grid = $('videoGrid');
      grid.innerHTML = '';
      $('statVideos').textContent = state.videos.length;

    // ============ Game 1: Catch the hearts ============

    })();

    // ============ Game 2: Memory match ============
    const memoryGame = (() => {
      const grid = $('memGrid');
      const pairs = 6;
      const symbols = ['🎂', '🎈', '🎁', '🌸', '🎀', '⭐'];
      let first = null, lock = false, moves = 0, matched = 0;
      const hud = () => { $('memMoves').textContent = 'Moves: ' + moves; };
      function build() {
        grid.innerHTML = ''; first = null; lock = false; moves = 0; matched = 0; hud();
        $('memMsg').textContent = '';
        const faces = [];
        for (let i = 0; i < pairs; i++) faces.push(state.photos[i] ? { key: 'p' + i, img: state.photos[i] } : { key: 's' + i, sym: symbols[i] });
        shuffle([...faces, ...faces]).forEach((f) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'mcard'; b.dataset.key = f.key; b.setAttribute('aria-label', 'Memory card');
          b.innerHTML = `<span class="in"><span class="face front">✦</span><span class="face back">${f.img ? `<img src="${f.img}" alt="" />` : f.sym}</span></span>`;
          b.addEventListener('click', () => flip(b));
          grid.appendChild(b);
        });
      }
      function flip(card) {
        if (lock || card.classList.contains('flip')) return;
        card.classList.add('flip');
        if (!first) { first = card; return; }
        moves++; hud();
        if (first.dataset.key === card.dataset.key) {
          first.classList.add('matched'); card.classList.add('matched'); first = null; matched++;
          if (matched === pairs) setTimeout(() => { $('memMsg').textContent = `All pairs found in ${moves} moves ✨`; win('memory'); }, 700);
        } else {
          lock = true; const a = first; first = null;
          setTimeout(() => { a.classList.remove('flip'); card.classList.remove('flip'); lock = false; }, 850);
        }
      }
      $('memReset').addEventListener('click', build);
      return { build };
    })();

    // ============ Game 3: Make a wish (candles) ============
    const cakeGame = (() => {
      const svg = $('cakeSvg');
      const n = Math.min(birthdayAge, 30);
      const cols = ['#f08aa3', '#a58bd0', '#e7c46d', '#7fc4c4', '#f3a77f'];
      let left = n;
      const drops = (x0, x1, y, count, fill, seed) => {
        let out = ''; const w = (x1 - x0) / count;
        for (let i = 0; i < count; i++) {
          const h = 10 + ((i * 7 + seed) % 5) * 7;
          out += `<rect x="${(x0 + i * w + w * .15).toFixed(1)}" y="${y}" width="${(w * .7).toFixed(1)}" height="${h}" rx="${(w * .35).toFixed(1)}" fill="${fill}"/>`;
        }
        return out;
      };
      const pearls = (x0, x1, y, count, r) => {
        let out = '';
        for (let i = 0; i < count; i++) out += `<circle cx="${(x0 + (x1 - x0) * i / (count - 1)).toFixed(1)}" cy="${y}" r="${r}" fill="#fff" opacity=".78"/>`;
        return out;
      };
      function build() {
        left = n;
        const x0 = 148, x1 = 412, step = n > 1 ? (x1 - x0) / (n - 1) : 0;
        let stars = '';
        for (let i = 0; i < 26; i++) stars += `<circle class="tw" cx="${rnd(8, 552).toFixed(0)}" cy="${rnd(6, 120).toFixed(0)}" r="${rnd(.8, 2).toFixed(1)}" fill="#fff" style="animation-delay:${rnd(0, 3).toFixed(1)}s"/>`;
        let candles = '';
        for (let i = 0; i < n; i++) {
          const cx = n > 1 ? x0 + i * step : 280;
          const hw = Math.max(step, 18);
          candles += `<g class="candle" data-i="${i}">
            <circle class="glow" cx="${cx}" cy="82" r="18" fill="url(#glowG)"/>
            <rect x="${cx - 4}" y="94" width="8" height="40" rx="2" fill="${cols[i % cols.length]}"/>
            <rect x="${cx - 4}" y="103" width="8" height="4" fill="#fff" opacity=".55"/>
            <rect x="${cx - 4}" y="115" width="8" height="4" fill="#fff" opacity=".55"/>
            <path class="flame" d="M${cx} 68 C${cx + 6} 77 ${cx + 5} 88 ${cx} 93 C${cx - 5} 88 ${cx - 6} 77 ${cx} 68Z" fill="url(#flameG)"/>
            <circle class="smoke" cx="${cx}" cy="76" r="5" fill="#d8cfe3"/>
            <rect class="hit" x="${cx - hw / 2}" y="58" width="${hw}" height="78" fill="transparent"/>
          </g>`;
        }
        svg.innerHTML = `
          <defs>
            <linearGradient id="cakeA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b6c6"/><stop offset="1" stop-color="#e58aa4"/></linearGradient>
            <linearGradient id="cakeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c7f2"/><stop offset="1" stop-color="#b79de0"/></linearGradient>
            <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4ff"/><stop offset="1" stop-color="#d9cbe8"/></linearGradient>
            <radialGradient id="flameG" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffc857"/><stop offset="1" stop-color="#ff8a3d"/></radialGradient>
            <radialGradient id="glowG"><stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
          </defs>
          ${stars}
          <ellipse cx="280" cy="322" rx="250" ry="12" fill="rgba(0,0,0,.25)"/>
          <ellipse cx="280" cy="306" rx="252" ry="24" fill="url(#plateG)"/>
          <rect x="60" y="196" width="440" height="108" rx="22" fill="url(#cakeA)"/>
          <rect x="56" y="188" width="448" height="26" rx="13" fill="#fff7f9"/>
          ${drops(64, 496, 204, 15, '#fff7f9', 3)}
          <text x="280" y="266" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="34" fill="#fff">Happy ${birthdayAge}th</text>
          ${pearls(84, 476, 288, 16, 4.5)}
          <rect x="100" y="128" width="360" height="76" rx="18" fill="url(#cakeB)"/>
          <rect x="96" y="120" width="368" height="24" rx="12" fill="#fffaf2"/>
          ${drops(104, 456, 134, 13, '#fffaf2', 1)}
          ${pearls(124, 436, 184, 12, 3.8)}
          <g>${candles}</g>`;
        $('cakeLeft').textContent = left;
        $('cakeMsg').textContent = '';
      }
      function finish() {
        $('cakeMsg').textContent = P.cake.done;
        const first = !won.has('cake');
        win('cake');
        if (!first) burst(60);
      }
      function blow(c) {
        if (c.classList.contains('out')) return;
        c.classList.add('out'); left--;
        $('cakeLeft').textContent = left;
        if (left === 0) finish();
      }
      function handle(e) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const c = el && el.closest ? el.closest('.candle') : null;
        if (c) blow(c);
      }
      svg.addEventListener('pointerdown', handle);
      svg.addEventListener('pointermove', (e) => { if (e.buttons) handle(e); });
      $('blowAll').addEventListener('click', () => {
        [...svg.querySelectorAll('.candle:not(.out)')].forEach((c, i) => setTimeout(() => blow(c), i * 70));
      });
      $('relight').addEventListener('click', build);
      build();
      return { build };
    })();

    // ============ Game 4: Scratch card ============
    const scratchGame = (() => {
      const box = $('scratchBox'), cv = $('scratchCv');
      let ctx = null, built = false, done = false, drawing = false, moves = 0, last = null, W = 0, H = 0, dpr = 1;
      function build() {
        if (done) return;
        const r = box.getBoundingClientRect();
        if (!r.width) return;
        if (built && Math.abs(W - r.width) < 2) return;
        W = r.width; H = r.height; dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, '#e8cf94'); g.addColorStop(.35, '#f8e9c3'); g.addColorStop(.62, '#d9b872'); g.addColorStop(1, '#f1ddb0');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 110; i++) { ctx.fillStyle = `rgba(255,255,255,${rnd(.1, .6).toFixed(2)})`; ctx.beginPath(); ctx.arc(rnd(0, W), rnd(0, H), rnd(.4, 2.4), 0, 7); ctx.fill(); }
        ctx.fillStyle = 'rgba(110,80,40,.78)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `600 ${Math.round(W / 20)}px Inter, sans-serif`; ctx.fillText('SCRATCH HERE', W / 2, H / 2 - W * .025);
        ctx.font = `italic 500 ${Math.round(W / 22)}px "Cormorant Garamond", Georgia, serif`; ctx.fillText('✦ a little birthday surprise ✦', W / 2, H / 2 + W * .045);
        built = true;
      }
      const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
      function scratch(a, b) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = Math.max(28, W / 14); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      function check() {
        if (!ctx || done) return;
        const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
        let clear = 0, total = 0;
        for (let i = 3; i < d.length; i += 4 * 37) { total++; if (d[i] < 30) clear++; }
        if (total && clear / total > .5) { done = true; cv.classList.add('done'); win('scratch'); }
      }
      cv.addEventListener('pointerdown', (e) => {
        if (done || !built) return;
        drawing = true; cv.setPointerCapture(e.pointerId); last = pt(e); scratch(last, last);
      });
      cv.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const p = pt(e); scratch(last, p); last = p;
        if (++moves % 10 === 0) check();
      });
      const stop = () => { if (drawing) { drawing = false; check(); } };
      cv.addEventListener('pointerup', stop);
      cv.addEventListener('pointercancel', stop);
      addEventListener('resize', () => { if (!done && !$('game-scratch').hidden) build(); });
      return { build };
    })();

    // --- tabs + text ---
    function showGame(id) {
      document.querySelectorAll('#gameTabs button').forEach(b => b.classList.toggle('active', b.dataset.game === id));
      document.querySelectorAll('.game').forEach(g => { g.hidden = g.id !== 'game-' + id; });
      if (id !== 'catch') catchGame.pause();
      if (id === 'scratch') scratchGame.build();
    }
    $('gameTabs').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-game]');
      if (b) showGame(b.dataset.game);
    });
    $('playTitle').textContent = P.title;
    $('playSubtitle').textContent = P.subtitle;
    $('catchTitle').textContent = P.catch.title;
    $('catchHint').textContent = P.catch.hint;
    $('memTitle').textContent = P.memory.title;
    $('memHint').textContent = P.memory.hint;
    $('cakeTitle').textContent = P.cake.title;
    $('cakeHint').textContent = P.cake.hint;
    $('scratchTitle').textContent = P.scratch.title;
    $('scratchHint').textContent = P.scratch.hint;
    $('scratchEyebrow').textContent = P.scratch.eyebrow;
    $('scratchPrize').textContent = P.scratch.prize;
    $('scratchFine').textContent = P.scratch.fine;
    $('unlock').innerHTML = `<span>${P.locked}</span>`;
    renderBadges();

    // --- Boot ---
    (async function init() {
      const [photos, videos, music] = await Promise.all([detectPhotos(), detectVideos(), detectMusic()]);
      state.photos = photos; state.videos = videos; state.music = music;
      renderPhotos(); renderVideos(); renderMusic(); memoryGame.build();
      if (new URLSearchParams(location.search).has('setup')) buildSetupPanel();
      onScroll();
    })();
  </script>
</body>
</html>
